<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iziSwap - Decentralized DeFi Portal</title>
  <meta name="description" content="Secure, non-custodial portal for iziSwap DeFi operations directly from your own wallet.">
  <link rel="canonical" href="https://iziswap-page.github.io/">
  <meta name="robots" content="index,follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="prefetch" href="dashboard/">
  <link rel="prerender" href="dashboard/">
  <style>


:root{
  --bg:#F7F8F8;
  --surface:#FFFFFF;
  --inset:#F1F4F4;
  --ink:#101617;
  --muted:#657073;
  --faint:#99A4A6;
  --accent:#00C2C7;
  --accent-dark:#009EA3;
  --accent-soft:rgba(0,194,199,.12);
  --line:rgba(16,22,23,.09);
  --line-strong:rgba(16,22,23,.16);
  --shadow:0 28px 70px -34px rgba(16,22,23,.34);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  color:var(--ink);
  background:
    radial-gradient(62% 44% at 50% -10%, rgba(0,194,199,.14), transparent 58%),
    linear-gradient(180deg, #FFFFFF 0%, var(--bg) 58%, #F2F4F4 100%);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,p{margin:0}
h1{
  font-size:clamp(3rem, 7vw, 4.75rem);
  line-height:1.02;
  font-weight:800;
  letter-spacing:0;
}

.topbar{
  flex:none;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:68px;
  padding:16px clamp(16px, 4vw, 42px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  font-size:1.08rem;
  font-weight:800;
}

.brand img{
  flex:none;
  width:28px;
  height:28px;
  border-radius:8px;
  box-shadow:0 0 0 1px var(--line);
}

.nav{
  display:flex;
  align-items:center;
  gap:26px;
  margin-left:18px;
}

.nav a{
  color:var(--muted);
  font-size:.93rem;
  font-weight:560;
  transition:color .16s ease;
}

.nav a:hover{color:var(--ink)}
.sp{flex:1}

.ghost{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:0 18px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:rgba(255,255,255,.72);
  color:var(--ink);
  font-size:.9rem;
  font-weight:700;
  box-shadow:0 10px 26px -22px rgba(16,22,23,.35);
  transition:transform .14s ease, border-color .16s ease, background .16s ease;
}

.ghost:hover{
  transform:translateY(-1px);
  border-color:rgba(0,194,199,.38);
  background:#FFFFFF;
}

.stage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:30px;
  width:100%;
  padding:14px clamp(16px, 4vw, 42px) 8px;
  text-align:center;
}

.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.sub{
  max-width:49ch;
  margin-top:16px;
  color:var(--muted);
  font-size:clamp(1rem, 1.7vw, 1.18rem);
}

.sub strong{
  color:var(--ink);
  font-weight:800;
  box-shadow:inset 0 -.48em 0 var(--accent-soft);
}

.card{
  width:min(560px, 100%);
  padding:20px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.route{
  display:flex;
  align-items:stretch;
  gap:12px;
}

.leg{
  flex:1;
  min-width:0;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--inset);
  text-align:left;
}

.lbl{
  display:block;
  color:var(--faint);
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.chip{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  margin-top:9px;
  font-size:1.08rem;
  font-weight:800;
}

.ic{
  flex:none;
  width:26px;
  height:26px;
  border-radius:50%;
}

.token{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dir{
  flex:none;
  align-self:center;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid var(--line-strong);
  border-radius:50%;
  background:#FFFFFF;
  color:var(--muted);
  cursor:pointer;
  box-shadow:0 12px 28px -24px rgba(16,22,23,.45);
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}

.dir:hover{
  transform:translateY(-1px);
  color:var(--accent-dark);
  border-color:rgba(0,194,199,.42);
  background:var(--accent-soft);
}

.ar{
  display:inline-block;
  font-size:1.1rem;
  line-height:1;
}

.act{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:56px;
  margin-top:16px;
  border-radius:14px;
  background:var(--accent);
  color:#FFFFFF;
  font-size:1.05rem;
  font-weight:800;
  box-shadow:0 22px 46px -28px rgba(0,158,163,.75);
  transition:transform .14s ease, background .16s ease;
}

.act:hover{
  transform:translateY(-1px);
  background:var(--accent-dark);
}

.foot{
  flex:none;
  padding:18px 24px 24px;
  color:var(--faint);
  text-align:center;
  font-size:.85rem;
}

@media(max-width:620px){
  .topbar{
    min-height:62px;
    gap:10px;
    padding:14px 16px;
  }

  .nav{display:none}
  .brand{font-size:1rem}
  .ghost{
    min-height:36px;
    padding:0 14px;
    font-size:.86rem;
  }

  .stage{
    justify-content:flex-start;
    gap:22px;
    padding:36px 16px 8px;
  }

  h1{font-size:3.25rem}
  .sub{
    margin-top:13px;
    max-width:31ch;
    font-size:1rem;
  }

  .card{
    padding:16px;
    border-radius:20px;
  }

  .route{
    flex-direction:column;
    gap:10px;
  }

  .leg{padding:13px 14px}
  .dir{
    width:38px;
    height:38px;
  }
  .ar{transform:rotate(90deg)}
  .act{
    min-height:52px;
    margin-top:14px;
  }
  .foot{padding:12px 16px 18px}
}

@media(max-width:380px){
  h1{font-size:3rem}
  .stage{padding-top:28px}
  .sub{font-size:.96rem}
  .card{padding:14px}
}


  
.footer {
  text-align: center !important;
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.png" width="30" height="30" alt="">
      <span>iziSwap</span>
    </div>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Main Navigation">
      <a href="how-it-works/">How it works</a>
      <a href="faq/">FAQ</a>
      <a href="about/">About</a>
      <a href="security/">Security</a>
      <a href="supported-chains/">Supported Chains</a>
    </nav>
  </header>
  <main class="stage" style="padding: 100px 24px; text-align: center; max-width: 800px; margin: 0 auto;">
    <h1 style="font-size: clamp(2.5rem, 6vw, 4.5rem); margin-bottom: 24px; font-weight: 800;">iziSwap</h1>
    <p class="value" style="font-size: 1.25rem; opacity: 0.8; margin-bottom: 40px; line-height: 1.6;">Secure, non-custodial gateway for decentralized operations. Connect your Web3 wallet to enter the portal.</p>
    <a class="open-app" href="dashboard/" style="display: inline-flex; justify-content: center; align-items: center; min-height: 52px; padding: 0 32px; border-radius: 9999px; background: var(--accent, #625bf3); color: #fff; font-weight: 700; text-decoration: none; font-size: 1.1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: transform 0.2s ease;">Open App Dashboard</a>
  </main>
  <footer class="footer">iziSwap &mdash; 2026</footer>
</body>
</html>
